# Temporary diagnostic: curl the valuation debug endpoint from a GitHub runner
# (the dev sandbox cannot reach vercel.app directly). Runs on every push to the
# calculator branch, AFTER waiting for the Vercel preview to redeploy. Remove
# once the comp-search funnel is verified.
name: valuation-debug-probe

on:
  push:
    branches:
      - claude/trade-in-value-calculator-7ywced

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Fetch debug endpoint (show redirect chain)
        run: |
          curl -sS -D headers.txt -L --max-time 120 \
            "https://sg-e0f88b33-2555-4eac-800d-c7-git-0cbc75-vincialmedias-projects.vercel.app/api/valuation/comps?make=VW&model=Golf&year=2020&km=78003&debug=2" \
            -o out.json -w "final HTTP %{http_code} after %{num_redirects} redirects in %{time_total}s\n" || true
          echo "=== HEADERS ==="
          cat headers.txt
          echo "=== BODY START ==="
          head -c 80000 out.json
          echo ""
          echo "=== BODY END ==="
